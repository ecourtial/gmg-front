services:

    ############################
    ## NGINX
    ############################
    nginx:
        container_name: nginx_gmg-front
        build:
            context: docker/nginx
        ports:
            - ${HTTP_PORT:-8080}:80
        volumes:
            - ./docker/nginx/config/nginx.conf:/etc/nginx/nginx.conf
            - ./docker/nginx/config/vhost.conf:/etc/nginx/conf.d/vhost.template
            - ./app/public:/var/www/html/public:ro
        depends_on:
            - php

    ############################
    ## PHP
    ############################
    php:
        user: "${UID}:${GID}"
        hostname: php_gmg-front
        container_name: php_gmg-front
        build:
            context: docker/php
        environment:
            COMPOSER_MEMORY_LIMIT: -1
            PHP_IDE_CONFIG: "serverName=gmg-frontdebug"
        volumes:
            - ./app:/var/www/html
            - ./app/.composer:/.composer
        extra_hosts:
            - host.docker.internal:host-gateway
